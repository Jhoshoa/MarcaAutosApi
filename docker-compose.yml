services:
  postgres_db:
    image: postgres:16-alpine
    container_name: marcas_autos_postgres
    environment:
      POSTGRES_DB: MarcasAutosDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MarcasAutosDb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  